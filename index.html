<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie Privée</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --chat-bg: #ffffff;
            --primary: #2563eb;
            --text: #1e293b;
            --user-msg: #dbeafe;
            --ai-msg: #f3f4f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            height: 95vh;
            overflow: hidden;
        }

        .header {
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .role-selector, .name-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9em;
        }

        select, input[type="text"], input[type="password"] {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .api-panel {
            padding: 8px 16px;
            background: #fffbebfb;
            border-bottom: 1px solid #fef3c7;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .api-panel input {
            flex: 1;
        }

        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 0.95em;
            word-wrap: break-word;
        }

        .message.Homme {
            align-self: flex-end;
            background-color: var(--user-msg);
            border-bottom-right-radius: 2px;
        }

        .message.KH {
            align-self: flex-start;
            background-color: var(--ai-msg);
            border-bottom-left-radius: 2px;
        }

        .message .sender {
            font-weight: bold;
            font-size: 0.75em;
            margin-bottom: 4px;
            opacity: 0.7;
        }

        .status {
            font-size: 0.8em;
            color: #64748b;
            font-style: italic;
            padding: 4px 16px;
            min-height: 20px;
        }

        .footer {
            padding: 12px 16px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            resize: none;
            height: 40px;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95em;
        }

        button {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            height: 40px;
        }

        button:hover {
            opacity: 0.9;
        }

        .kh-only {
            display: none;
        }

        .prompt-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .prompt-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header avec Choix des Noms et Rôle -->
    <div class="header">
        <div class="role-selector">
            <label><strong>Rôle :</strong></label>
            <select id="userRole" onchange="toggleRoleUI()">
                <option value="Homme">Homme</option>
                <option value="KH">KH</option>
            </select>
        </div>

        <div class="name-picker">
            <label>Mon nom :</label>
            <input type="text" id="userNameInput" placeholder="Ex: Alex" onkeyup="saveUserName()">
        </div>

        <!-- Contrôles réservés à KH -->
        <div class="kh-only" id="khControls">
            <label><input type="checkbox" id="aiToggle" checked> Activer l'IA</label>
            <button onclick="openPromptModal()" style="height:auto; padding:4px 8px; font-size:0.8em;">Prompt</button>
        </div>
    </div>

    <!-- Panneau Clé API -->
    <div class="api-panel">
        <label>🔑 Clé API :</label>
        <input type="password" id="apiKey" placeholder="Collez votre clé Gemini" onchange="saveApiKey()">
    </div>

    <!-- Zone de discussion -->
    <div class="chat-box" id="chatBox"></div>

    <div class="status" id="statusBox"></div>

    <!-- Pied de page avec écriture -->
    <div class="footer">
        <textarea id="messageInput" placeholder="Écrivez votre message..." onkeydown="handleKeyPress(event)"></textarea>
        <button onclick="sendMessage()">Envoyer</button>
    </div>
</div>

<!-- Modal Caché pour le Prompt (Réservé KH) -->
<div class="prompt-modal" id="promptModal">
    <div class="prompt-content">
        <h3>Configuration du Prompt Système</h3>
        <textarea id="systemPromptInput" style="height:120px;" placeholder="Instructions pour l'IA..."></textarea>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
            <button onclick="closePromptModal()" style="background:#64748b;">Fermer</button>
            <button onclick="savePrompt()">Enregistrer</button>
        </div>
    </div>
</div>

<script>
    // Configuration par défaut
    const DEFAULT_PROMPT = "Tu es KH. Tu réponds de façon naturelle, amicale et fluide au message de l'Homme.";
    
    // Chargement initial
    window.onload = function() {
        document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';
        document.getElementById('userNameInput').value = localStorage.getItem('user_custom_name') || '';
        document.getElementById('systemPromptInput').value = localStorage.getItem('system_prompt') || DEFAULT_PROMPT;
        
        toggleRoleUI();
        renderMessages();
    };

    function saveApiKey() {
        localStorage.setItem('gemini_api_key', document.getElementById('apiKey').value.trim());
    }

    function saveUserName() {
        localStorage.setItem('user_custom_name', document.getElementById('userNameInput').value.trim());
    }

    function toggleRoleUI() {
        const role = document.getElementById('userRole').value;
        const khControls = document.getElementById('khControls');
        
        if (role === 'KH') {
            khControls.style.display = 'flex';
            khControls.style.gap = '10px';
        } else {
            khControls.style.display = 'none';
        }
    }

    function getMessages() {
        return JSON.parse(localStorage.getItem('chat_history') || '[]');
    }

    function saveMessages(messages) {
        localStorage.setItem('chat_history', JSON.stringify(messages));
        renderMessages();
    }

    function renderMessages() {
        const chatBox = document.getElementById('chatBox');
        const messages = getMessages();
        chatBox.innerHTML = '';

        messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = `message ${msg.role}`;
            
            const senderSpan = document.createElement('div');
            senderSpan.className = 'sender';
            senderSpan.innerText = msg.senderName || msg.role;

            const textSpan = document.createElement('div');
            textSpan.innerText = msg.text;

            div.appendChild(senderSpan);
            div.appendChild(textSpan);
            chatBox.appendChild(div);
        });

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        const role = document.getElementById('userRole').value;
        const customName = document.getElementById('userNameInput').value.trim() || role;
        const apiKey = document.getElementById('apiKey').value.trim();

        const messages = getMessages();
        messages.push({ role: role, senderName: customName, text: text });
        saveMessages(messages);
        input.value = '';

        // Si l'Homme écrit ET que l'IA est activée (ou demandée)
        const isAIEnabled = document.getElementById('aiToggle').checked;
        if (role === 'Homme' && isAIEnabled) {
            if (!apiKey) {
                alert("Veuillez entrer une clé API Gemini pour obtenir une réponse de l'IA.");
                return;
            }
            await fetchAIResponse(apiKey, messages);
        }
    }

    async function fetchAIResponse(apiKey, history) {
        const statusBox = document.getElementById('statusBox');
        statusBox.innerText = "L'IA réécrit une réponse...";

        const promptSystem = localStorage.getItem('system_prompt') || DEFAULT_PROMPT;
        
        // Préparation du contenu pour l'API Gemini 3.8 Flash
        const contents = history.map(msg => ({
            role: msg.role === 'Homme' ? 'user' : 'model',
            parts: [{ text: msg.text }]
        }));

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: promptSystem }] },
                    contents: contents
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiReply = data.candidates[0].content.parts[0].text;
                const updatedHistory = getMessages();
                updatedHistory.push({ role: 'KH', senderName: 'KH (IA)', text: aiReply });
                saveMessages(updatedHistory);
            } else {
                alert("Erreur lors de la réponse de l'IA : " + JSON.stringify(data));
            }
        } catch (err) {
            alert("Erreur de connexion avec l'API Gemini.");
            console.error(err);
        } finally {
            statusBox.innerText = "";
        }
    }

    function openPromptModal() {
        document.getElementById('promptModal').style.display = 'flex';
    }

    function closePromptModal() {
        document.getElementById('promptModal').style.display = 'none';
    }

    function savePrompt() {
        const newPrompt = document.getElementById('systemPromptInput').value.trim();
        localStorage.setItem('system_prompt', newPrompt);
        closePromptModal();
    }
</script>

</body>
</html>
